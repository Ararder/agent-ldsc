name: container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ararder/agent-ldsc

jobs:
  # Pull requests: build and test locally, never publish.
  pr-build-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64
          load: true
          tags: agent-ldsc:test
          build-args: SOURCE_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test suite inside the image
        run: ./container/ci-test.sh agent-ldsc:test

  # main / tags: build once and push by source SHA, then test that exact digest.
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: SOURCE_SHA=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record digest
        run: |
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  test-docker:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test suite inside the pushed image
        run: |
          docker pull "${IMAGE}@${{ needs.build.outputs.digest }}"
          ./container/ci-test.sh "${IMAGE}@${{ needs.build.outputs.digest }}"
      - name: Fixture run under Docker
        run: ./container/ci-fixture-run.sh docker "${IMAGE}@${{ needs.build.outputs.digest }}" "$RUNNER_TEMP/docker"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-docker
          path: ${{ runner.temp }}/docker/run/output/ldsR

  test-apptainer:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: eWaterCycle/setup-apptainer@4bb22c52d4f63406c49e94c804632975787312b3 # v2.0.0
        with:
          apptainer-version: 1.3.6
      - name: Convert exact digest to SIF
        run: |
          apptainer pull "$RUNNER_TEMP/agent-ldsc.sif" "docker://${IMAGE}@${{ needs.build.outputs.digest }}"
          sha256sum "$RUNNER_TEMP/agent-ldsc.sif" | tee "$RUNNER_TEMP/sif.sha256"
          echo "SIF sha256: \`$(cut -d' ' -f1 "$RUNNER_TEMP/sif.sha256")\` from \`${{ needs.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Fixture run under Apptainer
        run: ./container/ci-fixture-run.sh apptainer "$RUNNER_TEMP/agent-ldsc.sif" "$RUNNER_TEMP/apptainer"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-apptainer
          path: ${{ runner.temp }}/apptainer/run/output/ldsR

  parity:
    needs: [build, test-docker, test-apptainer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: parity
      - name: Docker and Apptainer outputs are semantically identical
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/parity:/parity:ro" --entrypoint /opt/envs/worker/bin/python \
            "${IMAGE}@${{ needs.build.outputs.digest }}" -I /src/container/compare_ldsr.py \
            /parity/fixture-docker /parity/fixture-apptainer

  # Tags: promote the tested digest (no rebuild).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, parity]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag tested digest with the version
        run: |
          docker buildx imagetools create -t "${IMAGE}:${GITHUB_REF_NAME}" "${IMAGE}@${{ needs.build.outputs.digest }}"
          echo "Released \`${IMAGE}:${GITHUB_REF_NAME}\` = \`${IMAGE}@${{ needs.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
